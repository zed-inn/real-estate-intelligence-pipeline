syntax = "proto3";

package intelligence_events;

import "google/protobuf/descriptor.proto";

enum FieldCategory {
  CATEGORY_UNSPECIFIED = 0;
  CATEGORY_SKIP = 1;
  CATEGORY_LOCATION = 2;
  CATEGORY_PRICING = 3;
  CATEGORY_SPEC = 4;
  CATEGORY_AMENITY = 5;
  CATEGORY_SECURITY = 6;
  CATEGORY_PROXIMITY = 7;
  CATEGORY_SCORE = 8;
  CATEGORY_INFRASTRUCTURE = 9;
}

message PropertyFieldMetadata {
  string natural_tone = 1;
  string label = 2;
  FieldCategory category = 3;
}

extend google.protobuf.FieldOptions {
  optional PropertyFieldMetadata info = 50000;
}

